<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="1200" viewBox="0 0 900 1200"
     role="img" aria-labelledby="title desc">
  <title id="title">Vectis Concepts refined character</title>
  <desc id="desc">Layered refined male hero character concept with clean line art, costume panels, armour details, shadows and transparent background.</desc>

  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3140"/>
      <stop offset="1" stop-color="#18151b"/>
    </linearGradient>

    <linearGradient id="purpleAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b260d2"/>
      <stop offset="0.55" stop-color="#7e36a3"/>
      <stop offset="1" stop-color="#4d1d68"/>
    </linearGradient>

    <linearGradient id="suitFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b6870"/>
      <stop offset="0.55" stop-color="#4b4950"/>
      <stop offset="1" stop-color="#2b2930"/>
    </linearGradient>

    <linearGradient id="armourFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8d6dc"/>
      <stop offset="0.45" stop-color="#96939d"/>
      <stop offset="1" stop-color="#54515b"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10"
                    flood-color="#1c1321" flood-opacity="0.26"/>
    </filter>

    <filter id="roughLine" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012"
                    numOctaves="2" seed="73" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise"
                         scale="0.9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <style>
      .outline { fill:none; stroke:url(#lineGrad); stroke-width:8; stroke-linecap:round; stroke-linejoin:round; }
      .detail { fill:none; stroke:#28232c; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .fine { fill:none; stroke:#4f4654; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .accent { fill:none; stroke:url(#purpleAccent); stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <!-- 01_TRANSPARENT_BASE -->
  <g id="01_TRANSPARENT_BASE">
    <rect width="900" height="1200" fill="#ffffff" opacity="0"/>
  </g>

  <!-- 02_CAST_SHADOW -->
  <g id="02_CAST_SHADOW" opacity="0.20" filter="url(#softShadow)">
    <ellipse cx="455" cy="1114" rx="190" ry="34" fill="#251d29"/>
    <path d="M389 330 C347 480 352 680 325 1040"
          fill="none" stroke="#251d29" stroke-width="34"/>
  </g>

  <!-- 03_HEAD_BASE -->
  <g id="03_HEAD_BASE" filter="url(#roughLine)">
    <path d="M400 162
             C430 129 488 126 526 158
             C555 182 560 226 547 267
             C535 304 504 333 458 341
             C413 333 382 305 370 268
             C357 227 365 185 400 162Z"
          fill="#c9b6aa" stroke="url(#lineGrad)" stroke-width="8"/>
    <path d="M388 280 C407 319 432 337 458 342 C486 337 511 317 529 280"
          class="outline"/>
  </g>

  <!-- 04_HAIR -->
  <g id="04_HAIR" filter="url(#roughLine)">
    <path d="M377 204
             C362 145 413 102 472 106
             C531 109 570 149 566 207
             C541 185 516 167 486 157
             C446 145 409 158 377 204Z"
          fill="#3a303e" stroke="url(#lineGrad)" stroke-width="8"/>
