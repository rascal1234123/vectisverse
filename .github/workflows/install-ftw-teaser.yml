name: Install FTW teaser

on:
  push:
    paths:
      - 'vectisverse-site-v1/assets/ftw/ftw-upload.trigger'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and install FTW teaser
        shell: bash
        run: |
          set -euo pipefail
          dir='vectisverse-site-v1/assets/ftw'
          marker="$dir/ftw-upload.trigger"
          if [ ! -f "$marker" ]; then
            echo 'No upload marker present; nothing to do.'
            exit 0
          fi
          cat "$dir"/ftw-home-teaser-v3.part* > "$dir/ftw-home-teaser-v3.b64"
          base64 --decode "$dir/ftw-home-teaser-v3.b64" > "$dir/ftw-home-teaser-v3.webp"
          rm -f "$dir"/ftw-home-teaser-v3.part* "$dir/ftw-home-teaser-v3.b64" "$marker"
          python - <<'PY'
          from pathlib import Path
          p = Path('vectisverse-site-v1/index.html')
          s = p.read_text()
          s = s.replace('assets/ftw/ftw-home-teaser-layered-v2.svg?v=20260729-1', 'assets/ftw/ftw-home-teaser-v3.webp?v=20260729-2')
          s = s.replace('assets/ftw/ftw-home-teaser-layered-v2.svg', 'assets/ftw/ftw-home-teaser-v3.webp?v=20260729-2')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vectisverse-site-v1/index.html "$dir"
          git commit -m 'Install final FTW homepage teaser'
          git push
