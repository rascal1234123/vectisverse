<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="2020" height="660" viewBox="40 110 2020 660"
     role="img" aria-labelledby="title desc">
  <title id="title">Vectis Concepts production web master v2</title>
  <desc id="desc">Tightly cropped editable layered SVG for website use, with wireframe, cog, central V, VECTIS wordmark, CONCEPTS wordmark and tagline.</desc>

  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.16" stop-color="#9ca5ad"/>
      <stop offset="0.31" stop-color="#f9fbfc"/>
      <stop offset="0.49" stop-color="#5e6872"/>
      <stop offset="0.66" stop-color="#f6f8fa"/>
      <stop offset="0.83" stop-color="#77828c"/>
      <stop offset="1" stop-color="#d9dee2"/>
    </linearGradient>
    <linearGradient id="chromeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#68727c"/>
      <stop offset="0.45" stop-color="#1b2026"/>
      <stop offset="1" stop-color="#8e99a2"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d7ff"/>
      <stop offset="0.18" stop-color="#b75ce7"/>
      <stop offset="0.43" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#5a0b87"/>
      <stop offset="0.84" stop-color="#a944dc"/>
      <stop offset="1" stop-color="#2a003e"/>
    </linearGradient>
    <radialGradient id="disc" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#160524"/>
      <stop offset="0.65" stop-color="#050209"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="180%" height="190%">
      <feDropShadow dx="10" dy="14" stdDeviation="8" flood-color="#07010b" flood-opacity="0.72"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <g id="wireframe-layer" inkscape:groupmode="layer" inkscape:label="01 Wireframe Construction"
     fill="none" stroke="#7f2fb2" stroke-width="2.2" opacity="0.58">
    <line x1="75" y1="165" x2="50" y2="675"/><line x1="99" y1="165" x2="74" y2="675"/><line x1="123" y1="165" x2="98" y2="675"/><line x1="147" y1="165" x2="122" y2="675"/><line x1="171" y1="165" x2="146" y2="675"/><line x1="195" y1="165" x2="170" y2="675"/><line x1="219" y1="165" x2="194" y2="675"/><line x1="243" y1="165" x2="218" y2="675"/><line x1="267" y1="165" x2="242" y2="675"/><line x1="291" y1="165" x2="266" y2="675"/><line x1="315" y1="165" x2="290" y2="675"/><line x1="339" y1="165" x2="314" y2="675"/>
    <line x1="65" y1="175" x2="345" y2="135"/><line x1="65" y1="199" x2="345" y2="159"/><line x1="65" y1="223" x2="345" y2="183"/><line x1="65" y1="247" x2="345" y2="207"/><line x1="65" y1="271" x2="345" y2="231"/><line x1="65" y1="295" x2="345" y2="255"/><line x1="65" y1="319" x2="345" y2="279"/><line x1="65" y1="343" x2="345" y2="303"/><line x1="65" y1="367" x2="345" y2="327"/><line x1="65" y1="391" x2="345" y2="351"/><line x1="65" y1="415" x2="345" y2="375"/><line x1="65" y1="439" x2="345" y2="399"/><line x1="65" y1="463" x2="345" y2="423"/><line x1="65" y1="487" x2="345" y2="447"/><line x1="65" y1="511" x2="345" y2="471"/><line x1="65" y1="535" x2="345" y2="495"/><line x1="65" y1="559" x2="345" y2="519"/><line x1="65" y1="583" x2="345" y2="543"/><line x1="65" y1="607" x2="345" y2="567"/><line x1="65" y1="631" x2="345" y2="591"/><line x1="65" y1="655" x2="345" y2="615"/><line x1="65" y1="679" x2="345" y2="639"/>
    <circle cx="410" cy="420" r="185"/><circle cx="410" cy="420" r="142"/><line x1="75" y1="420" x2="650" y2="420"/><line x1="410" y1="125" x2="410" y2="725"/>
  </g>

  <g id="glow-layer" inkscape:groupmode="layer" inkscape:label="02 Purple Glow" opacity="0.82">
    <ellipse cx="760" cy="420" rx="640" ry="230" fill="#8a2be2" opacity="0.12" filter="url(#softGlow)"/>
    <circle cx="410" cy="230" r="75" fill="#b300ff" opacity="0.33" filter="url(#softGlow)"/>
  </g>

  <g id="cog-layer" inkscape:groupmode="layer" inkscape:label="03 Chrome Cog" filter="url(#shadow)">
    <polygon points="410.00,215.00 437.43,176.54 464.52,181.14 477.71,226.50 498.95,235.30 540.35,212.55 562.76,228.45 554.96,275.04 570.28,292.18 617.45,289.65 630.74,313.70 603.50,352.29 609.86,374.38 653.46,392.57 655.00,420.00 613.71,442.95 609.86,465.62 641.25,500.92 630.74,526.30 583.58,529.07 570.28,547.82 583.24,593.24 562.76,611.55 519.07,593.58 498.95,604.70 490.92,651.25 464.52,658.86 432.95,623.71 410.00,625.00 382.57,663.46 355.48,658.86 342.29,613.50 321.05,604.70 279.65,627.45 257.24,611.55 265.04,564.96 249.72,547.82 202.55,550.35 189.26,526.30 216.50,487.71 210.14,465.62 166.54,447.43 165.00,420.00 206.29,397.05 210.14,374.38 178.75,339.08 189.26,313.70 236.42,310.93 249.72,292.18 236.76,246.76 257.24,228.45 300.93,246.42 321.05,235.30 329.08,188.75 355.48,181.14 387.05,216.29" fill="url(#chrome)" stroke="#262f38" stroke-width="12"/>
    <circle cx="410" cy="420" r="184" fill="url(#disc)" stroke="#747e87" stroke-width="18"/>
    <circle cx="410" cy="420" r="170" fill="none" stroke="#a93fe2" stroke-width="5"/>
    <circle cx="410" cy="420" r="155" fill="none" stroke="#321048" stroke-width="2" opacity="0.85"/>
  </g>

  <g id="v-layer" inkscape:groupmode="layer" inkscape:label="04 Master V" filter="url(#shadow)">
    <polygon points="290,260 365,260 410,485 455,260 530,260 445,610 375,610" fill="url(#purple)" stroke="#1f062f" stroke-width="18" stroke-linejoin="round"/>
    <polygon points="290,260 365,260 410,485 455,260 530,260 445,610 375,610" fill="url(#chrome)" stroke="#b451e3" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="335,295 375,295 410,485 445,295 485,295 425,565 395,565" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.62"/>
  </g>

  <g id="flare-layer" inkscape:groupmode="layer" inkscape:label="05 Flare">
    <circle cx="410" cy="232" r="42" fill="#b300ff" opacity="0.52" filter="url(#softGlow)"/>
    <path d="M410 178 L416 222 L460 232 L416 240 L410 286 L404 240 L360 232 L404 222 Z" fill="#ffffff" stroke="#d798ff" stroke-width="3"/>
  </g>

  <g id="vectis-layer" inkscape:groupmode="layer" inkscape:label="06 VECTIS Wordmark" filter="url(#shadow)">
    <text x="690" y="410" font-family="Eurostile, Bank Gothic, Orbitron, Arial Black, sans-serif" font-size="250" font-weight="900" letter-spacing="-8" fill="#16051f" stroke="#08020c" stroke-width="24" paint-order="stroke">VECTIS</text>
    <text x="690" y="410" font-family="Eurostile, Bank Gothic, Orbitron, Arial Black, sans-serif" font-size="250" font-weight="900" letter-spacing="-8" fill="url(#chrome)" stroke="#a83fe1" stroke-width="6" paint-order="stroke">VECTIS</text>
  </g>

  <g id="concepts-layer" inkscape:groupmode="layer" inkscape:label="07 CONCEPTS Wordmark" filter="url(#shadow)">
    <text x="700" y="630" font-family="Eurostile, Bank Gothic, Orbitron, Arial Black, sans-serif" font-size="190" font-weight="900" letter-spacing="3" fill="#14041c" stroke="#08020c" stroke-width="22" paint-order="stroke">CONCEPTS</text>
    <text x="700" y="630" font-family="Eurostile, Bank Gothic, Orbitron, Arial Black, sans-serif" font-size="190" font-weight="900" letter-spacing="3" fill="url(#purple)" stroke="#ead7f7" stroke-width="4" paint-order="stroke">CONCEPTS</text>
  </g>

  <g id="tagline-layer" inkscape:groupmode="layer" inkscape:label="08 Tagline and Rules" fill="#692094">
    <rect x="730" y="725" width="130" height="5" rx="2.5"/><rect x="1910" y="725" width="130" height="5" rx="2.5"/>
    <text x="1385" y="750" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" letter-spacing="4">IDEAS THAT BUILD WORLDS.</text>
  </g>
</svg>
