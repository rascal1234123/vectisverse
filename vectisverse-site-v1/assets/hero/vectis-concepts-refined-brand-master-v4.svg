  <g id="vectis-wireframe" inkscape:groupmode="layer" inkscape:label="06A VECTIS Wireframe" clip-path="url(#vectis-wire)">
    <text x="650" y="405" font-family="Eurostile, Bank Gothic, Orbitron, Arial Black, sans-serif"
          font-size="250" font-weight="900" letter-spacing="-8"
          fill="none" stroke="#7f2db4" stroke-width="3">VECTIS</text>
    <text x="650" y="405" font-family="Eurostile, Bank Gothic, Orbitron, Arial Black, sans-serif"
          font-size="250" font-weight="900" letter-spacing="-8"
          fill="none" stroke="#d7a9ef" stroke-width="1" stroke-dasharray="7 7">VECTIS</text>
  </g>

  <g id="vectis-intermediate" inkscape:groupmode="layer" inkscape:label="06B VECTIS Intermediate" clip-path="url(#vectis-mid)">
    <text x="650" y="405" font-family="Eurostile, Bank Gothic, Orbitron, Arial Black, sans-serif"
          font-size="250" font-weight="900" letter-spacing="-8"
          fill="url(#chromeMid)" stroke="#8b43b9" stroke-width="7" paint-order="stroke">VECTIS</text>
    <text x="650" y="405" font-family="Eurostile, Bank Gothic, Orbitron, Arial Black, sans-serif"
          font-size="250" font-weight="900" letter-spacing="-8"
          fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2">VECTIS</text>
