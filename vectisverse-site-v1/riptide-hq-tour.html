<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b0d">
  <meta name="description" content="A standalone virtual tour prototype of Riptide HQ.">
  <title>Riptide HQ Virtual Tour | VectisVerse</title>
  <link rel="stylesheet" href="assets/css/riptide-hq-tour.css?v=20260808-7">
  <script defer src="assets/js/riptide-hq-tour-config.js?v=20260808-7"></script>
  <script defer src="assets/js/riptide-hq-tour.js?v=20260808-7"></script>
</head>
<body class="hq-tour-page">
  <a class="tour-skip" href="#tour-controls">Skip to tour controls</a>
  <main class="tour-shell" aria-label="Riptide HQ virtual tour">
    <section class="tour-viewport" data-tour-viewport tabindex="0" aria-label="Riptide HQ virtual tour — Team Area">
      <div class="tour-panorama" data-panorama aria-hidden="true"></div>
      <div class="tour-loading" data-loading role="status" aria-live="polite" hidden>Loading next area…</div>
      <button class="tour-move tour-move--forward" data-move="next" type="button" aria-label="Move forward" hidden><span aria-hidden="true">▲</span></button>
      <button class="tour-move tour-move--back" data-move="previous" type="button" aria-label="Move back" hidden><span aria-hidden="true">▼</span></button>
    </section>
    <div class="tour-ui" id="tour-controls">
      <div class="tour-location" aria-live="polite"><span data-quarter>Q2</span><strong data-location>Team Area</strong></div>
      <div class="tour-quarter-track" aria-label="Tour location"><span data-q="Q2" class="is-current">Q2</span><span data-q="Q3">Q3</span><span data-q="Q4">Q4</span></div>
      <div class="tour-actions"><button type="button" data-reset>Return to Start</button><a href="riptide.html" data-exit>Exit Tour</a></div>
    </div>
    <p class="tour-help">Drag to look around. Use W/S or the floor markers to move through HQ.</p>
    <p class="tour-live" data-live aria-live="polite"></p>
  </main>
</body>
</html>
