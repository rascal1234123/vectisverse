    <path d="M930 770 L885 700 L930 650 L975 700Z"
          fill="#7cefff" opacity=".15" stroke="#7cefff" stroke-width="4" filter="url(#neonGlow)"/>
    <circle cx="930" cy="692" r="18" fill="none" stroke="#d36fff" stroke-width="4"/>
