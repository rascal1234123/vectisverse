<line x1="65" y1="490" x2="430" y2="442"/>
<line x1="65" y1="524" x2="430" y2="476"/>
<line x1="65" y1="558" x2="430" y2="510"/>
<line x1="65" y1="592" x2="430" y2="544"/>
<line x1="65" y1="626" x2="430" y2="578"/>
<line x1="65" y1="660" x2="430" y2="612"/>
<line x1="65" y1="694" x2="430" y2="646"/>
<line x1="65" y1="728" x2="430" y2="680"/>
