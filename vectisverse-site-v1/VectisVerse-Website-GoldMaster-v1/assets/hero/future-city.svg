  <!-- 15_NEON_SIGNS -->
  <g id="15_NEON_SIGNS">
    <rect x="180" y="610" width="220" height="84" rx="10"
          fill="#181421" stroke="#7f3ba8" stroke-width="7"/>
    <text x="290" y="665" text-anchor="middle"
          font-family="Impact, Arial Narrow, sans-serif"
          font-size="46" fill="#d674ff" filter="url(#neonGlow)">V-TOWN</text>

    <rect x="1160" y="565" width="230" height="84" rx="10"
          fill="#131a21" stroke="#49b7d6" stroke-width="7"/>
    <text x="1275" y="620" text-anchor="middle"
          font-family="Impact, Arial Narrow, sans-serif"
          font-size="42" fill="#7de8ff" filter="url(#neonGlow)">FUTURE NOW</text>
  </g>

  <!-- 16_FLYING_VEHICLES -->
  <g id="16_FLYING_VEHICLES" filter="url(#roughEdge)">
    <g transform="translate(450 280)">
      <path d="M0 32 L54 4 H128 L178 32 L140 55 H36Z"
            fill="#2e3449" stroke="#10141e" stroke-width="7"/>
      <rect x="58" y="14" width="60" height="18" rx="8" fill="#73e4f7"/>
      <path d="M12 48 H166" stroke="#b458e0" stroke-width="5" filter="url(#neonGlow)"/>
    </g>
    <g transform="translate(980 235) scale(.75)">
      <path d="M0 32 L54 4 H128 L178 32 L140 55 H36Z"
            fill="#2e3449" stroke="#10141e" stroke-width="7"/>
      <rect x="58" y="14" width="60" height="18" rx="8" fill="#d26cff"/>
      <path d="M12 48 H166" stroke="#65e9ff" stroke-width="5" filter="url(#neonGlow)"/>
    </g>
    <g transform="translate(770 185) scale(.5)">
      <path d="M0 32 L54 4 H128 L178 32 L140 55 H36Z"
            fill="#2e3449" stroke="#10141e" stroke-width="7"/>
      <rect x="58" y="14" width="60" height="18" rx="8" fill="#78eaff"/>
    </g>
  </g>

  <!-- 17_TRAFFIC_LIGHT_TRAILS -->
  <g id="17_TRAFFIC_LIGHT_TRAILS" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M418 343 C325 330 245 340 168 370" stroke="#6eeeff" stroke-width="5"/>
    <path d="M1000 297 C1115 287 1230 306 1334 338" stroke="#c466f0" stroke-width="5"/>
    <path d="M760 223 C716 216 678 221 641 236" stroke="#72f0ff" stroke-width="4"/>
  </g>

  <!-- 18_STREET_LEVEL -->
