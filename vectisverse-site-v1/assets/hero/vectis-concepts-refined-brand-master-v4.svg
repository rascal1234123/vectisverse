             fill="url(#chrome)" stroke="#9e39d6" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="338,308 378,308 420,493 462,308 502,308 440,572 400,572"
             fill="#ffffff" fill-opacity=".10" stroke="#ffffff" stroke-width="2.5" opacity=".55"/>
