<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">V POP</title>
  <desc id="desc">The approved V homepage teaser artwork with its title treatment updated to V POP.</desc>
  <defs>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20d7ff"/>
      <stop offset="0.48" stop-color="#b854ff"/>
      <stop offset="1" stop-color="#ff3fb4"/>
    </linearGradient>
    <linearGradient id="topBlend" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08051d" stop-opacity=".98"/>
      <stop offset=".72" stop-color="#08051d" stop-opacity=".88"/>
      <stop offset="1" stop-color="#08051d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomBlend" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#08051d" stop-opacity=".98"/>
      <stop offset=".72" stop-color="#08051d" stop-opacity=".82"/>
      <stop offset="1" stop-color="#08051d" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panelClip"><rect width="1536" height="1024" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#panelClip)">
    <image href="v-home-teaser-v1.webp" xlink:href="v-home-teaser-v1.webp" width="1536" height="1024" preserveAspectRatio="xMidYMid slice"/>

    <!-- Branding-only masks remove the superseded V title and tagline without changing the character artwork. -->
    <rect x="0" y="0" width="1536" height="255" fill="url(#topBlend)"/>
    <rect x="0" y="852" width="1536" height="172" fill="url(#bottomBlend)"/>

    <!-- Approved V POP neon/cyber-pop title language. -->
    <g transform="translate(768 126)" text-anchor="middle">
      <path d="M-248,-65 L-174,78 L-104,-65 L-42,-65 L-143,105 L-210,105 L-311,-65 Z" fill="url(#brandGradient)" filter="url(#glow)"/>
      <path d="M-248,-65 L-174,78 L-104,-65" fill="none" stroke="#ffffff" stroke-opacity=".72" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="94" y="55" font-family="Arial Black, Impact, sans-serif" font-size="150" font-style="italic" font-weight="900" letter-spacing="-10" fill="url(#brandGradient)" stroke="#ffffff" stroke-opacity=".85" stroke-width="3" paint-order="stroke" filter="url(#softGlow)">POP</text>
      <g fill="#ffffff" opacity=".9">
        <path d="M300,-68 l8,20 20,8 -20,8 -8,20 -8,-20 -20,-8 20,-8z"/>
        <circle cx="345" cy="24" r="5"/><circle cx="-342" cy="4" r="6"/>
      </g>
      <g transform="translate(83 92)" fill="url(#brandGradient)" opacity=".92">
        <rect x="-172" y="0" width="12" height="27" rx="6"/><rect x="-150" y="-12" width="12" height="39" rx="6"/>
        <rect x="-128" y="-25" width="12" height="52" rx="6"/><rect x="-106" y="-7" width="12" height="34" rx="6"/>
        <rect x="-84" y="-18" width="12" height="45" rx="6"/><rect x="-62" y="-4" width="12" height="31" rx="6"/>
        <rect x="-40" y="-30" width="12" height="57" rx="6"/><rect x="-18" y="-12" width="12" height="39" rx="6"/>
        <rect x="4" y="-22" width="12" height="49" rx="6"/><rect x="26" y="-5" width="12" height="32" rx="6"/>
        <rect x="48" y="-16" width="12" height="43" rx="6"/><rect x="70" y="-2" width="12" height="29" rx="6"/>
        <rect x="92" y="-24" width="12" height="51" rx="6"/><rect x="114" y="-10" width="12" height="37" rx="6"/>
        <rect x="136" y="-18" width="12" height="45" rx="6"/><rect x="158" y="0" width="12" height="27" rx="6"/>
      </g>
    </g>
  </g>
</svg>
