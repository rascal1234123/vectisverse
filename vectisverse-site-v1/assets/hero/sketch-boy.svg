<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="1200" viewBox="0 0 900 1200"
     role="img" aria-labelledby="title desc">
  <title id="title">Vectis Concepts layered sketch boy</title>
  <desc id="desc">Layered rough graphite-style male character concept sketch with construction lines, pose guides, facial features, hair, clothing, annotations and transparent background.</desc>

  <defs>
    <linearGradient id="graphite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a404b"/>
      <stop offset="0.55" stop-color="#6b5a6f"/>
      <stop offset="1" stop-color="#2f2932"/>
    </linearGradient>

    <linearGradient id="purplePencil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d5ac0"/>
      <stop offset="1" stop-color="#592d72"/>
    </linearGradient>

    <filter id="roughPencil" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025"
                    numOctaves="2" seed="67" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise"
                         scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="softSmudge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <style>
      .construction { fill:none; stroke:#b29db8; stroke-width:5; opacity:.34; stroke-linecap:round; stroke-linejoin:round; }
      .rough { fill:none; stroke:url(#graphite); stroke-width:7; opacity:.77; stroke-linecap:round; stroke-linejoin:round; }
      .detail { fill:none; stroke:#433746; stroke-width:6; opacity:.92; stroke-linecap:round; stroke-linejoin:round; }
      .accent { fill:none; stroke:url(#purplePencil); stroke-width:7; opacity:.72; stroke-linecap:round; stroke-linejoin:round; }
      .note { font-family: "Comic Sans MS", "Bradley Hand", cursive; font-size:26px; fill:#6f5b73; opacity:.72; }
    </style>
  </defs>

