    <linearGradient id="graphite" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b3f4f"/><stop offset="0.55" stop-color="#6f5b73"/><stop offset="1" stop-color="#312a35"/></linearGradient>
