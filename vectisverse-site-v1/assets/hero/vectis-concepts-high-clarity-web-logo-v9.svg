<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Vectis Concepts</title>
  <desc id="desc">Vectis Concepts production logo with cog emblem, chrome lettering, restrained construction lines and the strapline Ideas That Build Worlds.</desc>
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".09" stop-color="#6d7680"/><stop offset=".22" stop-color="#f8fafb"/><stop offset=".38" stop-color="#252b31"/><stop offset=".53" stop-color="#fff"/><stop offset=".69" stop-color="#525c65"/><stop offset=".86" stop-color="#f2f4f5"/><stop offset="1" stop-color="#737d86"/></linearGradient>
    <radialGradient id="disc"><stop offset="0" stop-color="#190528"/><stop offset=".7" stop-color="#07010b"/><stop offset="1" stop-color="#000"/></radialGradient>
    <filter id="wordShadow" x="-10%" y="-14%" width="124%" height="136%"><feDropShadow dx="2" dy="3" stdDeviation="1.8" flood-color="#16091d" flood-opacity=".28"/></filter>
    <filter id="emblemShadow" x="-25%" y="-25%" width="160%" height="170%"><feDropShadow dx="2.5" dy="4" stdDeviation="3.2" flood-color="#000" flood-opacity=".38"/></filter>
    <filter id="flareGlow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <g id="presentation-scale" transform="translate(30 10) scale(.95)">
    <g id="construction-layer" inkscape:groupmode="layer" inkscape:label="01 Construction Lines" fill="none" stroke="#a15bd5" stroke-linecap="square">
      <g opacity=".55" stroke-width="1.5"><line x1="295" y1="102" x2="820" y2="102"/><line x1="295" y1="198" x2="820" y2="198"/><line x1="295" y1="236" x2="820" y2="236"/><line x1="295" y1="330" x2="820" y2="330"/><line x1="365" y1="82" x2="365" y2="350"/><line x1="455" y1="82" x2="455" y2="350"/><line x1="545" y1="82" x2="545" y2="350"/><line x1="635" y1="82" x2="635" y2="350"/><line x1="725" y1="82" x2="725" y2="350"/></g>
      <g opacity=".48" stroke-width="1.7"><line x1="28" y1="218" x2="278" y2="218"/><line x1="153" y1="54" x2="153" y2="365"/><circle cx="153" cy="218" r="72"/><circle cx="153" cy="218" r="94"/><circle cx="153" cy="218" r="119"/></g>
    </g>
    <g id="emblem-layer" inkscape:groupmode="layer" inkscape:label="02 Cog Emblem" filter="url(#emblemShadow)">
      <polygon points="153,109 166,90 179,92 185,115 195,118 214,104 225,111 223,135 231,142 254,136 261,147 249,167 255,177 278,181 281,194 262,207 263,218 282,231 280,244 257,249 254,259 267,278 260,289 237,287 229,294 234,317 224,324 204,313 194,318 190,341 178,344 164,326 153,326 141,345 128,344 122,321 112,318 93,331 82,324 85,302 77,294 54,299 47,289 58,269 53,259 31,255 28,243 46,229 45,218 26,206 28,193 50,187 53,177 40,158 47,147 70,150 77,142 72,119 82,112 102,123 112,118 116,96 128,92 143,110" fill="url(#chrome)" stroke="#24272c" stroke-width="7"/>
      <circle cx="153" cy="218" r="101" fill="url(#disc)" stroke="#8b2fcd" stroke-width="4"/><circle cx="153" cy="218" r="91" fill="none" stroke="#4b2265" stroke-width="2"/>
      <path d="M93 124h28l32 156 34-156h28l-44 220h-36z" fill="url(#chrome)" stroke="#8426bd" stroke-width="3.5"/><path d="M93 124h28l32 156 34-156h28l-44 220h-36z" fill="none" stroke="#d69bff" stroke-width="1.7" opacity=".9"/>
    </g>
    <g id="wordmark-layer" inkscape:groupmode="layer" inkscape:label="03 Chrome Wordmark" filter="url(#wordShadow)" font-family="Arial Black,Impact,sans-serif" font-weight="900"><text x="300" y="220" font-size="108" letter-spacing="-3" fill="url(#chrome)" stroke="#111014" stroke-width="8" paint-order="stroke fill">VECTIS</text><text x="300" y="334" font-size="94" letter-spacing="-4" fill="url(#chrome)" stroke="#111014" stroke-width="8" paint-order="stroke fill">CONCEPTS</text></g>
    <g id="bevel-layer" inkscape:groupmode="layer" inkscape:label="04 Purple Bevel" fill="none" stroke="#9d42d6" stroke-width="3"><text x="300" y="220" font-family="Arial Black,Impact,sans-serif" font-size="108" font-weight="900" letter-spacing="-3">VECTIS</text><text x="300" y="334" font-family="Arial Black,Impact,sans-serif" font-size="94" font-weight="900" letter-spacing="-4">CONCEPTS</text></g>
    <g id="ground-shadow-layer" inkscape:groupmode="layer" inkscape:label="05 Ground Shadows"><ellipse cx="154" cy="358" rx="80" ry="6" fill="#171019" opacity=".10"/><ellipse cx="640" cy="357" rx="260" ry="6" fill="#171019" opacity=".065"/></g>
    <g id="flare-layer" inkscape:groupmode="layer" inkscape:label="06 Flare"><circle cx="153" cy="96" r="18" fill="#bc44ff" opacity=".28" filter="url(#flareGlow)"/><path d="M153 77l4 15 15 4-15 4-4 15-4-15-15-4 15-4z" fill="#fff" stroke="#d99eff" stroke-width="1.4"/></g>
    <g id="tagline-layer" inkscape:groupmode="layer" inkscape:label="07 Tagline" fill="#7e2bb9"><line x1="300" y1="387" x2="365" y2="387" stroke="#7f29be" stroke-width="3"/><line x1="975" y1="387" x2="1040" y2="387" stroke="#7f29be" stroke-width="3"/><text x="670" y="400" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800" text-anchor="middle" letter-spacing="3.5">IDEAS THAT BUILD WORLDS.</text></g>
  </g>
</svg>
