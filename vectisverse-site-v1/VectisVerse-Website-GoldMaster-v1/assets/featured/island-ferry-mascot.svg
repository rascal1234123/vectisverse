<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="760" viewBox="0 0 1200 760"
     role="img" aria-labelledby="title desc">
  <title id="title">Island Ferry Mascot featured concept</title>
  <desc id="desc">Layered comic-style island ferry mascot concept featuring a cheerful anthropomorphic ferry, harbour, island cliffs, gulls and maritime branding elements.</desc>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc8e8"/>
      <stop offset="0.58" stop-color="#c9e7f0"/>
      <stop offset="1" stop-color="#f2d59f"/>
    </linearGradient>

    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d9cb3"/>
      <stop offset="1" stop-color="#14546a"/>
    </linearGradient>

    <linearGradient id="hullGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfc"/>
      <stop offset="0.6" stop-color="#dce9ee"/>
      <stop offset="1" stop-color="#b8c9d0"/>
    </linearGradient>

    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e84d5b"/>
      <stop offset="1" stop-color="#9f1f35"/>
    </linearGradient>

    <linearGradient id="islandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#587c4f"/>
      <stop offset="1" stop-color="#293f32"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="9"
                    flood-color="#163b48" flood-opacity="0.28"/>
    </filter>

    <filter id="roughInk" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>

    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="3" seed="5" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.10"/>
      </feComponentTransfer>
    </filter>

    <clipPath id="panelClip">
      <rect x="8" y="8" width="1184" height="744"/>
    </clipPath>
  </defs>

  <!-- 01_BACKGROUND -->
  <g id="01_BACKGROUND">
    <rect width="1200" height="760" fill="#071015"/>
  </g>

  <!-- 02_SKY -->
  <g id="02_SKY" clip-path="url(#panelClip)">
    <rect x="8" y="8" width="1184" height="480" fill="url(#skyGrad)"/>
    <circle cx="965" cy="116" r="58" fill="#ffe7a9" opacity="0.65"/>
  </g>

  <!-- 03_CLOUDS -->
  <g id="03_CLOUDS" fill="#ffffff" opacity="0.52">
    <path d="M90 128 C132 84 201 89 231 130 C272 103 331 111 352 150 C281 161 180 164 105 153Z"/>
    <path d="M735 96 C774 61 832 68 858 103 C897 81 946 88 967 123 C908 135 824 137 752 128Z"/>
  </g>

  <!-- 04_DISTANT_ISLAND -->
  <g id="04_DISTANT_ISLAND" filter="url(#roughInk)">
    <path d="M0 390
             C132 335 237 344 335 382
             C440 423 543 415 657 369
             C787 317 917 326 1200 398
             V520 H0Z"
          fill="url(#islandGrad)"/>
    <path d="M0 430 C140 389 280 401 398 432 C573 478 717 408 877 385 C1009 366 1114 389 1200 420"
          fill="none" stroke="#d9d0b2" stroke-width="18" opacity="0.72"/>
  </g>

  <!-- 05_HARBOUR_BUILDINGS -->
  <g id="05_HARBOUR_BUILDINGS">
    <rect x="76" y="352" width="86" height="84" fill="#d8c7a8" stroke="#26353a" stroke-width="6"/>
    <path d="M65 353 L119 315 L173 353Z" fill="#9e4e43" stroke="#26353a" stroke-width="6"/>
    <rect x="100" y="378" width="22" height="58" fill="#4e7180"/>

    <rect x="176" y="335" width="102" height="101" fill="#efe4ce" stroke="#26353a" stroke-width="6"/>
    <path d="M166 336 L227 295 L288 336Z" fill="#395d74" stroke="#26353a" stroke-width="6"/>
    <rect x="207" y="366" width="24" height="70" fill="#9b5b48"/>

    <rect x="932" y="338" width="96" height="96" fill="#d9c8b0" stroke="#26353a" stroke-width="6"/>
    <path d="M921 339 L980 300 L1039 339Z" fill="#b55345" stroke="#26353a" stroke-width="6"/>
    <rect x="962" y="368" width="24" height="66" fill="#4d6c77"/>
  </g>

  <!-- 06_SEA -->
  <g id="06_SEA">
    <rect x="8" y="425" width="1184" height="327" fill="url(#seaGrad)"/>
    <g fill="none" stroke="#c7edf2" stroke-width="6" opacity="0.38">
      <path d="M20 493 C150 472 280 520 407 493 C536 466 666 513 793 489 C914 467 1055 511 1180 486"/>
      <path d="M35 564 C162 541 296 588 429 562 C555 537 690 582 820 560 C957 536 1079 578 1182 556"/>
      <path d="M52 638 C178 612 308 657 445 631 C581 605 716 649 847 626 C969 605 1080 643 1170 626"/>
    </g>
  </g>

  <!-- 07_WAKE -->
  <g id="07_WAKE" fill="none" stroke="#e9fbff" stroke-linecap="round">
    <path d="M340 610 C500 558 691 561 872 625" stroke-width="30" opacity="0.58"/>
    <path d="M387 647 C526 607 673 608 826 654" stroke-width="16" opacity="0.55"/>
  </g>

  <!-- 08_MASCOT_FERRY_SHADOW -->
  <g id="08_MASCOT_FERRY_SHADOW" opacity="0.22" transform="translate(0 12)">
    <ellipse cx="610" cy="618" rx="263" ry="50" fill="#153744"/>
  </g>

  <!-- 09_MASCOT_HULL -->
  <g id="09_MASCOT_HULL" filter="url(#softShadow)">
    <path d="M364 536
             C393 490 438 454 496 438
             H724
             C782 454 827 490 856 536
             L821 622
             C758 657 458 657 395 622Z"
          fill="url(#hullGrad)" stroke="#173746" stroke-width="12" stroke-linejoin="round"/>
    <path d="M395 548 H825 L805 607 C744 632 476 632 415 607Z"
          fill="url(#redGrad)" stroke="#173746" stroke-width="9"/>
  </g>

  <!-- 10_SUPERSTRUCTURE -->
  <g id="10_SUPERSTRUCTURE">
    <path d="M458 432 L485 325 H735 L762 432Z"
          fill="#f3f7f8" stroke="#173746" stroke-width="11" stroke-linejoin="round"/>
    <rect x="505" y="286" width="208" height="71"
          rx="18" fill="#dce9ee" stroke="#173746" stroke-width="10"/>
    <rect x="535" y="304" width="148" height="34"
          rx="12" fill="#6da5b4" stroke="#173746" stroke-width="7"/>
  </g>

  <!-- 11_FACE_WINDOWS -->
  <g id="11_FACE_WINDOWS">
    <rect x="502" y="372" width="88" height="58" rx="18"
          fill="#315b6a" stroke="#173746" stroke-width="9"/>
    <rect x="630" y="372" width="88" height="58" rx="18"
          fill="#315b6a" stroke="#173746" stroke-width="9"/>
    <ellipse cx="548" cy="399" rx="15" ry="20" fill="#f4fbff"/>
    <ellipse cx="674" cy="399" rx="15" ry="20" fill="#f4fbff"/>
    <circle cx="553" cy="404" r="7" fill="#142d38"/>
    <circle cx="679" cy="404" r="7" fill="#142d38"/>
    <circle cx="548" cy="397" r="3" fill="#ffffff"/>
    <circle cx="674" cy="397" r="3" fill="#ffffff"/>
  </g>

  <!-- 12_MASCOT_MOUTH -->
  <g id="12_MASCOT_MOUTH">
    <path d="M534 493 C572 530 648 530 686 493"
          fill="none" stroke="#173746" stroke-width="13" stroke-linecap="round"/>
    <path d="M565 514 C590 529 628 529 654 514"
          fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 13_MASCOT_ARMS -->
  <g id="13_MASCOT_ARMS" fill="none" stroke="#173746" stroke-width="14" stroke-linecap="round">
    <path d="M385 509 C337 476 306 447 286 410"/>
    <path d="M833 510 C878 476 910 448 933 411"/>
  </g>

  <!-- 14_MASCOT_HANDS -->
  <g id="14_MASCOT_HANDS" fill="#f3f7f8" stroke="#173746" stroke-width="10">
    <circle cx="278" cy="397" r="28"/>
    <circle cx="942" cy="397" r="28"/>
    <path d="M257 389 L238 371 M270 373 L265 349 M288 376 L301 356"
          fill="none" stroke="#173746" stroke-width="8" stroke-linecap="round"/>
    <path d="M924 389 L907 370 M941 372 L944 348 M957 378 L972 358"
          fill="none" stroke="#173746" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- 15_FUNNEL_AND_FLAG -->
  <g id="15_FUNNEL_AND_FLAG">
    <rect x="584" y="231" width="52" height="58" fill="url(#redGrad)" stroke="#173746" stroke-width="9"/>
    <rect x="578" y="221" width="64" height="18" fill="#1b3540"/>
    <path d="M636 242 L704 217 V270 L636 252Z"
          fill="#8e35b6" stroke="#173746" stroke-width="7"/>
    <path d="M656 231 L672 231 L664 246 L672 261 L656 261 L664 246Z" fill="#f5e9ff"/>
  </g>

  <!-- 16_ISLAND_EMBLEM -->
  <g id="16_ISLAND_EMBLEM" transform="translate(573 552)">
    <circle cx="37" cy="28" r="34" fill="#f4efe4" stroke="#173746" stroke-width="7"/>
    <path d="M12 34 C25 18 38 17 54 25 C64 30 69 38 62 44 C48 42 34 45 20 47Z"
          fill="#5b7f53"/>
    <path d="M18 39 C32 31 44 31 58 37" fill="none" stroke="#2d6171" stroke-width="5"/>
  </g>

  <!-- 17_SEAGULLS -->
  <g id="17_SEAGULLS" fill="none" stroke="#294653" stroke-width="7" stroke-linecap="round">
    <path d="M160 194 C174 180 188 180 202 194 C216 180 230 180 244 194"/>
    <path d="M840 180 C852 168 864 168 876 180 C888 168 900 168 912 180"/>
    <path d="M1035 238 C1047 227 1058 227 1070 238 C1082 227 1093 227 1105 238"/>
  </g>

  <!-- 18_SIGNAL_SPARKS -->
  <g id="18_SIGNAL_SPARKS" fill="#8b35b5">
    <path d="M208 286 L218 308 L242 312 L222 326 L227 351 L208 336 L188 351 L194 326 L174 312 L198 308Z"/>
    <path d="M1002 275 L1010 293 L1031 296 L1015 309 L1019 329 L1002 317 L985 329 L989 309 L973 296 L994 293Z"/>
    <circle cx="254" cy="236" r="8"/>
    <circle cx="963" cy="240" r="8"/>
  </g>

  <!-- 19_ATMOSPHERE -->
  <g id="19_ATMOSPHERE">
    <rect x="8" y="8" width="1184" height="744" fill="#7a3f8f" opacity="0.035"/>
    <rect x="8" y="8" width="1184" height="744" filter="url(#paperNoise)" opacity="0.48"/>
  </g>

  <!-- 20_FRAME -->
  <g id="20_FRAME">
    <rect x="8" y="8" width="1184" height="744" fill="none" stroke="#081015" stroke-width="16"/>
    <rect x="22" y="22" width="1156" height="716" fill="none" stroke="#6e8e98" stroke-width="2" opacity="0.6"/>
  </g>
</svg>
