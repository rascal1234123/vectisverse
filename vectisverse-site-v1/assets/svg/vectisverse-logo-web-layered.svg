<g id="VV_Starburst_Core" fill="#fff" stroke="#9cecff" stroke-width="2"><path d="M837 55L846 141 936 151 846 161 837 251 828 161 738 151 828 141Z"/><path d="M781 92L831 145 895 99 845 152 901 211 843 165 780 215 831 159Z" opacity=".82"/></g>
