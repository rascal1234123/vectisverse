<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-labelledby="title desc">
  <title id="title">Brand Storytelling icon</title>
  <desc id="desc">Layered purple comic-style megaphone and story signal icon for Vectis Concepts.</desc>

  <defs>
    <linearGradient id="purpleMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b39d3"/>
      <stop offset="0.55" stop-color="#6d22a5"/>
      <stop offset="1" stop-color="#461167"/>
    </linearGradient>

    <linearGradient id="purpleLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a8ff"/>
      <stop offset="1" stop-color="#8c3ac0"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7"
                    flood-color="#2b093f" flood-opacity="0.30"/>
    </filter>

    <filter id="roughInk" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018"
                    numOctaves="2" seed="29" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise"
                         scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- 01_SHADOW -->
  <g id="01_SHADOW" opacity="0.22" transform="translate(0 10)">
    <path d="M112 211 L244 174 L378 103 L398 122 L374 352 L246 292 L132 280Z"
          fill="#2b093f"/>
    <path d="M183 284 L236 298 L219 408 L170 391Z" fill="#2b093f"/>
  </g>

  <!-- 02_BACK_SIGNAL_WAVES -->
  <g id="02_BACK_SIGNAL_WAVES"
     fill="none" stroke="url(#purpleMain)"
     stroke-width="16" stroke-linecap="round" opacity="0.58">
    <path d="M400 153 C444 182 458 224 449 266"/>
    <path d="M420 118 C485 160 505 221 491 285"/>
  </g>

  <!-- 03_MEGAPHONE_BODY -->
  <g id="03_MEGAPHONE_BODY" filter="url(#softShadow)">
    <path d="M126 210
             L242 179
             L378 108
             L364 348
             L241 291
             L126 277Z"
          fill="url(#purpleLight)"
          stroke="url(#purpleMain)"
          stroke-width="18"
          stroke-linejoin="round"/>
  </g>

  <!-- 04_MEGAPHONE_FACETS -->
  <g id="04_MEGAPHONE_FACETS" opacity="0.48">
    <path d="M242 179 L378 108 L364 348 L241 291Z" fill="#7c2bb0"/>
    <path d="M126 210 L242 179 L241 291 L126 277Z" fill="#d5a3f3"/>
    <path d="M242 179 L271 166 L268 304 L241 291Z" fill="#f1d7ff" opacity="0.7"/>
  </g>

  <!-- 05_MOUTHPIECE -->
  <g id="05_MOUTHPIECE">
    <path d="M90 219 L126 210 L126 277 L90 268Z"
          fill="#4a126c"
          stroke="url(#purpleMain)"
          stroke-width="18"
          stroke-linejoin="round"/>
    <path d="M88 235 H64 Q54 235 54 245 V251 Q54 261 64 261 H88"
          fill="none" stroke="url(#purpleMain)"
          stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- 06_HANDLE -->
  <g id="06_HANDLE" filter="url(#roughInk)">
    <path d="M181 282
             L237 296
             L218 406
             L168 390Z"
          fill="url(#purpleLight)"
          stroke="url(#purpleMain)"
          stroke-width="18"
          stroke-linejoin="round"/>
    <path d="M180 320 L227 332"
          fill="none" stroke="#e2b5fa"
          stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- 07_BRAND_STORY_RIBBON -->
  <g id="07_BRAND_STORY_RIBBON" filter="url(#roughInk)">
    <path d="M294 167
             C327 144 361 140 388 151
             C369 174 360 197 362 221
             C335 208 311 188 294 167Z"
          fill="#f0d8ff"
          stroke="url(#purpleMain)"
          stroke-width="12"
          stroke-linejoin="round"/>
    <path d="M315 164 C337 155 357 155 374 162"
          fill="none" stroke="#8d38bd"
          stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 08_STORY_LINES -->
  <g id="08_STORY_LINES"
     fill="none" stroke="url(#purpleMain)"
     stroke-width="10" stroke-linecap="round">
    <path d="M301 237 H345"/>
    <path d="M298 260 H338"/>
    <path d="M292 283 H329"/>
  </g>

  <!-- 09_FRONT_SIGNAL_WAVES -->
  <g id="09_FRONT_SIGNAL_WAVES"
     fill="none" stroke="url(#purpleMain)"
     stroke-width="18" stroke-linecap="round">
    <path d="M392 181 C420 200 428 226 423 251"/>
    <path d="M402 312 C428 292 439 270 441 250"/>
  </g>

  <!-- 10_STORY_SPARKS -->
  <g id="10_STORY_SPARKS" fill="url(#purpleMain)">
    <path d="M118 121 L128 143 L152 147 L132 161
             L137 186 L118 171 L98 186 L104 161
             L84 147 L108 143Z"/>
    <path d="M402 76 L410 94 L431 97 L415 110
             L419 130 L402 118 L385 130 L389 110
             L373 97 L394 94Z"/>
    <circle cx="95" cy="330" r="9"/>
    <circle cx="455" cy="347" r="9"/>
    <circle cx="458" cy="175" r="7"/>
  </g>

  <!-- 11_HIGHLIGHTS -->
  <g id="11_HIGHLIGHTS"
     fill="none" stroke="#f0d3ff"
     stroke-width="8" stroke-linecap="round" opacity="0.84">
    <path d="M150 214 L232 192"/>
    <path d="M282 172 L354 134"/>
    <path d="M182 301 L220 311"/>
  </g>
</svg>
