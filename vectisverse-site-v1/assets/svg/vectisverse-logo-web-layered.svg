</g>
<g id="VV_Speed_Lines" fill="none" stroke-linecap="square"><path d="M207 157L723 148" stroke="#e9fbff" stroke-width="12"/><path d="M332 135L744 132" stroke="#00b9f5" stroke-width="6"/><path d="M875 151L1354 158" stroke="#e9fbff" stroke-width="12"/><path d="M946 130L1402 139" stroke="#00b9f5" stroke-width="6"/></g>
