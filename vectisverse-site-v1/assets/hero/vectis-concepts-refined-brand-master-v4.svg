          font-size="188" font-weight="900" letter-spacing="2"
          fill="none" stroke="#ffffff" stroke-opacity=".46" stroke-width="2">CONCEPTS</text>
  </g>

  <g id="concepts-finished" inkscape:groupmode="layer" inkscape:label="07C CONCEPTS Finished"
     clip-path="url(#concepts-final)" filter="url(#shadow)">
    <text x="675" y="635" font-family="Eurostile, Bank Gothic, Orbitron, Arial Black, sans-serif"
          font-size="188" font-weight="900" letter-spacing="2"
          fill="#13031b" stroke="#08020b" stroke-width="21" paint-order="stroke">CONCEPTS</text>
