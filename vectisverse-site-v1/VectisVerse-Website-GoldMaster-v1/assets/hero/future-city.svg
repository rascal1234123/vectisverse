      <rect x="685" y="360" width="42" height="26"/><rect x="748" y="360" width="42" height="26"/><rect x="811" y="360" width="42" height="26"/><rect x="874" y="360" width="42" height="26"/>
      <rect x="674" y="425" width="42" height="26"/><rect x="737" y="425" width="42" height="26"/><rect x="800" y="425" width="42" height="26"/><rect x="863" y="425" width="42" height="26"/>
      <rect x="663" y="490" width="42" height="26"/><rect x="726" y="490" width="42" height="26"/><rect x="789" y="490" width="42" height="26"/><rect x="852" y="490" width="42" height="26"/>
      <rect x="652" y="555" width="42" height="26"/><rect x="715" y="555" width="42" height="26"/><rect x="778" y="555" width="42" height="26"/><rect x="841" y="555" width="42" height="26"/>
    </g>
    <path d="M800 300 V760" stroke="#a559d0" stroke-width="8" opacity=".45"/>
  </g>

  <!-- 11_SKYBRIDGES -->
  <g id="11_SKYBRIDGES">
    <path d="M450 430 C565 405 647 408 704 430"
          fill="none" stroke="#1a2030" stroke-width="42" stroke-linecap="round"/>
    <path d="M450 430 C565 405 647 408 704 430"
          fill="none" stroke="url(#neonCyan)" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)"/>
    <path d="M930 415 C1035 392 1124 398 1200 430"
          fill="none" stroke="#1a2030" stroke-width="42" stroke-linecap="round"/>
    <path d="M930 415 C1035 392 1124 398 1200 430"
          fill="none" stroke="url(#neonPurple)" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)"/>
  </g>

  <!-- 12_ELEVATED_ROAD_BACK -->
  <g id="12_ELEVATED_ROAD_BACK">
    <path d="M-40 690 C260 610 520 615 770 675 C1010 731 1320 718 1640 640"
          fill="none" stroke="#101521" stroke-width="88" stroke-linecap="round"/>
    <path d="M-40 690 C260 610 520 615 770 675 C1010 731 1320 718 1640 640"
          fill="none" stroke="url(#roadGrad)" stroke-width="70" stroke-linecap="round"/>
    <path d="M-40 690 C260 610 520 615 770 675 C1010 731 1320 718 1640 640"
          fill="none" stroke="#55dff3" stroke-width="4" stroke-dasharray="30 22" opacity=".78"/>
  </g>

  <!-- 13_ELEVATED_ROAD_FRONT -->
  <g id="13_ELEVATED_ROAD_FRONT">
    <path d="M-40 825 C300 755 590 770 830 830 C1090 895 1350 880 1640 805"
          fill="none" stroke="#0c1018" stroke-width="108" stroke-linecap="round"/>
    <path d="M-40 825 C300 755 590 770 830 830 C1090 895 1350 880 1640 805"
          fill="none" stroke="url(#roadGrad)" stroke-width="88" stroke-linecap="round"/>
    <path d="M-40 825 C300 755 590 770 830 830 C1090 895 1350 880 1640 805"
          fill="none" stroke="#bd62ff" stroke-width="5" stroke-dasharray="36 26" opacity=".8"/>
  </g>

  <!-- 14_ROAD_SUPPORTS -->
  <g id="14_ROAD_SUPPORTS" fill="#151a26" stroke="#0a0d14" stroke-width="6">
    <path d="M200 694 L225 694 L245 1000 H170Z"/>
    <path d="M510 665 L535 668 L545 1000 H475Z"/>
    <path d="M1030 708 L1055 710 L1090 1000 H1010Z"/>
    <path d="M1350 682 L1375 680 L1425 1000 H1340Z"/>
