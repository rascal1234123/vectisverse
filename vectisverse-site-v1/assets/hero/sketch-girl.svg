    <filter id="roughPencil" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="softSmudge" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <style>.construction{fill:none;stroke:#b29db8;stroke-width:5;opacity:.35;stroke-linecap:round;stroke-linejoin:round}.rough{fill:none;stroke:url(#graphite);stroke-width:7;opacity:.76;stroke-linecap:round;stroke-linejoin:round}.detail{fill:none;stroke:#443848;stroke-width:6;opacity:.92;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:url(#purplePencil);stroke-width:7;opacity:.72;stroke-linecap:round;stroke-linejoin:round}.note{font-family:"Comic Sans MS","Bradley Hand",cursive;font-size:26px;fill:#6f5b73;opacity:.72}</style>
