<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="2400" height="900" viewBox="0 0 2400 900"
     role="img" aria-labelledby="title desc">
  <title id="title">Vectis Concepts refined brand master v4</title>
  <desc id="desc">A layered identity transitioning from blueprint wireframe through intermediate construction into finished chrome and purple forms.</desc>

  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.10" stop-color="#717b84"/>
      <stop offset="0.22" stop-color="#f8fafb"/>
      <stop offset="0.38" stop-color="#3f4851"/>
      <stop offset="0.54" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#616b75"/>
      <stop offset="0.88" stop-color="#eef1f3"/>
      <stop offset="1" stop-color="#8a949d"/>
    </linearGradient>
    <linearGradient id="chromeMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f8992" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#f7f9fa" stop-opacity=".65"/>
      <stop offset="1" stop-color="#68727c" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c8ff"/>
      <stop offset=".18" stop-color="#b250e4"/>
      <stop offset=".38" stop-color="#7f22b8"/>
      <stop offset=".58" stop-color="#4b0082"/>
      <stop offset=".80" stop-color="#8f37c6"/>
      <stop offset="1" stop-color="#2a003d"/>
    </linearGradient>
    <linearGradient id="purpleMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f2db4" stop-opacity=".16"/>
      <stop offset=".50" stop-color="#a85ed3" stop-opacity=".58"/>
      <stop offset="1" stop-color="#5c0d86" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="disc" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#170424"/>
      <stop offset=".66" stop-color="#050108"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>

    <filter id="shadow" x="-35%" y="-35%" width="190%" height="200%">
      <feDropShadow dx="8" dy="11" stdDeviation="6" flood-color="#08010c" flood-opacity=".72"/>
    </filter>
    <filter id="flareGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <clipPath id="vectis-wire"><rect x="620" y="105" width="300" height="360"/></clipPath>
    <clipPath id="vectis-mid"><rect x="820" y="105" width="520" height="360"/></clipPath>
    <clipPath id="vectis-final"><rect x="1180" y="105" width="1080" height="360"/></clipPath>
    <clipPath id="concepts-wire"><rect x="620" y="440" width="340" height="270"/></clipPath>
    <clipPath id="concepts-mid"><rect x="860" y="440" width="560" height="270"/></clipPath>
    <clipPath id="concepts-final"><rect x="1260" y="440" width="1000" height="270"/></clipPath>

    <linearGradient id="cogMaskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="black"/>
      <stop offset=".34" stop-color="black"/>
      <stop offset=".55" stop-color="#777"/>
      <stop offset=".74" stop-color="white"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="cogFinishedMask"><rect x="120" y="100" width="650" height="690" fill="url(#cogMaskGrad)"/></mask>
