<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600" height="1000" viewBox="0 0 1600 1000"
     role="img" aria-labelledby="title desc">
  <title id="title">Vectis Concepts Future City</title>
  <desc id="desc">Layered futuristic city environment with towers, elevated roads, neon signage, flying vehicles, atmospheric perspective and transparent framing for the Vectis Concepts hero sequence.</desc>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14112c"/>
      <stop offset="0.55" stop-color="#2c2453"/>
      <stop offset="1" stop-color="#5b3b73"/>
    </linearGradient>

    <linearGradient id="cityGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a54ee2"/>
      <stop offset="0.5" stop-color="#5f42c3"/>
      <stop offset="1" stop-color="#2d89bb"/>
    </linearGradient>

    <linearGradient id="towerFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38405f"/>
      <stop offset="0.55" stop-color="#20263c"/>
      <stop offset="1" stop-color="#121827"/>
    </linearGradient>

    <linearGradient id="towerSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#171d30"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>

    <linearGradient id="roadGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a2030"/>
      <stop offset="0.5" stop-color="#343a4b"/>
      <stop offset="1" stop-color="#161b28"/>
    </linearGradient>

    <linearGradient id="neonPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d26cff"/>
      <stop offset="1" stop-color="#7d34c5"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ff5ff"/>
      <stop offset="1" stop-color="#38a9d6"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="roughEdge" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015"
                    numOctaves="2" seed="83" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n"
                         scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.48"
                    numOctaves="3" seed="18" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.10"/>
      </feComponentTransfer>
    </filter>

    <clipPath id="cityClip">
      <rect x="0" y="0" width="1600" height="1000"/>
    </clipPath>

    <style>
      .window { fill:#6deaff; opacity:.82; }
      .window2 { fill:#c26cff; opacity:.76; }
      .line { fill:none; stroke:#1a1822; stroke-width:8; stroke-linejoin:round; stroke-linecap:round; }
      .fine { fill:none; stroke:#4f597b; stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
    </style>
  </defs>

  <!-- 01_BACKGROUND -->
  <g id="01_BACKGROUND">
    <rect width="1600" height="1000" fill="url(#skyGrad)"/>
  </g>

  <!-- 02_SKY_GLOW -->
  <g id="02_SKY_GLOW" opacity="0.32">
    <ellipse cx="800" cy="460" rx="540" ry="290" fill="#a44de0" filter="url(#softGlow)"/>
    <ellipse cx="1240" cy="300" rx="260" ry="170" fill="#44b9e0" filter="url(#softGlow)"/>
  </g>

  <!-- 03_CLOUD_HAZE -->
  <g id="03_CLOUD_HAZE" fill="#ccb6df" opacity="0.12" filter="url(#roughEdge)">
    <path d="M0 200 C180 125 375 150 520 220 C690 300 860 278 1030 210 C1200 145 1410 150 1600 240 V400 H0Z"/>
    <path d="M0 470 C220 400 390 430 560 500 C725 568 905 552 1080 485 C1260 416 1420 430 1600 500 V640 H0Z"/>
  </g>

  <!-- 04_DISTANT_CITY -->
  <g id="04_DISTANT_CITY" opacity="0.48">
    <rect x="40" y="420" width="90" height="310" fill="#262943"/>
    <rect x="150" y="360" width="110" height="370" fill="#20243c"/>
    <rect x="280" y="455" width="80" height="275" fill="#2b2d48"/>
    <rect x="1180" y="395" width="100" height="335" fill="#262943"/>
    <rect x="1300" y="330" width="120" height="400" fill="#20243c"/>
    <rect x="1450" y="440" width="92" height="290" fill="#2b2d48"/>
    <g fill="#79d8f1" opacity="0.35">
      <rect x="64" y="458" width="14" height="18"/><rect x="90" y="458" width="14" height="18"/>
      <rect x="177" y="400" width="16" height="20"/><rect x="210" y="400" width="16" height="20"/>
      <rect x="1205" y="435" width="16" height="20"/><rect x="1238" y="435" width="16" height="20"/>
      <rect x="1330" y="380" width="17" height="20"/><rect x="1367" y="380" width="17" height="20"/>
    </g>
  </g>

  <!-- 05_LEFT_TOWER -->
  <g id="05_LEFT_TOWER" filter="url(#roughEdge)">
    <path d="M110 760 L190 250 L430 250 L500 760Z"
          fill="url(#towerFace)" stroke="#12131c" stroke-width="10"/>
    <path d="M430 250 L510 330 L560 760 L500 760Z"
          fill="url(#towerSide)" stroke="#12131c" stroke-width="10"/>
    <path d="M190 250 L255 175 H388 L430 250Z"
          fill="#2d3150" stroke="#12131c" stroke-width="10"/>
    <rect x="260" y="195" width="112" height="28" rx="10" fill="url(#neonPurple)" filter="url(#neonGlow)"/>
  </g>

  <!-- 06_LEFT_TOWER_WINDOWS -->
  <g id="06_LEFT_TOWER_WINDOWS">
    <g class="window">
      <rect x="205" y="320" width="34" height="24"/><rect x="262" y="320" width="34" height="24"/><rect x="319" y="320" width="34" height="24"/>
      <rect x="198" y="375" width="34" height="24"/><rect x="255" y="375" width="34" height="24"/><rect x="312" y="375" width="34" height="24"/>
      <rect x="190" y="430" width="34" height="24"/><rect x="247" y="430" width="34" height="24"/><rect x="304" y="430" width="34" height="24"/>
      <rect x="180" y="490" width="34" height="24"/><rect x="237" y="490" width="34" height="24"/><rect x="294" y="490" width="34" height="24"/>
      <rect x="171" y="550" width="34" height="24"/><rect x="228" y="550" width="34" height="24"/><rect x="285" y="550" width="34" height="24"/>
    </g>
    <g class="window2">
      <rect x="372" y="332" width="30" height="22"/><rect x="382" y="390" width="30" height="22"/><rect x="392" y="448" width="30" height="22"/>
    </g>
  </g>

  <!-- 07_RIGHT_TOWER -->
  <g id="07_RIGHT_TOWER" filter="url(#roughEdge)">
    <path d="M1120 760 L1180 210 L1400 210 L1490 760Z"
          fill="url(#towerFace)" stroke="#12131c" stroke-width="10"/>
    <path d="M1400 210 L1480 300 L1540 760 L1490 760Z"
          fill="url(#towerSide)" stroke="#12131c" stroke-width="10"/>
    <path d="M1180 210 L1238 132 H1360 L1400 210Z"
          fill="#2d3150" stroke="#12131c" stroke-width="10"/>
    <rect x="1242" y="154" width="108" height="26" rx="10" fill="url(#neonCyan)" filter="url(#neonGlow)"/>
  </g>

  <!-- 08_RIGHT_TOWER_WINDOWS -->
  <g id="08_RIGHT_TOWER_WINDOWS">
    <g class="window">
      <rect x="1195" y="290" width="34" height="24"/><rect x="1252" y="290" width="34" height="24"/><rect x="1309" y="290" width="34" height="24"/>
      <rect x="1188" y="345" width="34" height="24"/><rect x="1245" y="345" width="34" height="24"/><rect x="1302" y="345" width="34" height="24"/>
      <rect x="1180" y="400" width="34" height="24"/><rect x="1237" y="400" width="34" height="24"/><rect x="1294" y="400" width="34" height="24"/>
      <rect x="1172" y="460" width="34" height="24"/><rect x="1229" y="460" width="34" height="24"/><rect x="1286" y="460" width="34" height="24"/>
      <rect x="1164" y="520" width="34" height="24"/><rect x="1221" y="520" width="34" height="24"/><rect x="1278" y="520" width="34" height="24"/>
    </g>
    <g class="window2">
      <rect x="1362" y="305" width="28" height="22"/><rect x="1372" y="365" width="28" height="22"/><rect x="1382" y="425" width="28" height="22"/>
    </g>
  </g>

  <!-- 09_CENTRAL_TOWER -->
  <g id="09_CENTRAL_TOWER" filter="url(#roughEdge)">
    <path d="M560 760 L650 300 L950 300 L1040 760Z"
