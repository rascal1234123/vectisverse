<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="2020" height="660" viewBox="40 110 2020 660" role="img" aria-labelledby="title desc">
<title id="title">Vectis Concepts production web master v3</title>
<desc id="desc">Vectis Concepts logo transitioning from blueprint wireframe construction into finished chrome and purple artwork.</desc>
<defs>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".16" stop-color="#9ca5ad"/><stop offset=".31" stop-color="#f9fbfc"/><stop offset=".49" stop-color="#5e6872"/><stop offset=".66" stop-color="#f6f8fa"/><stop offset=".83" stop-color="#77828c"/><stop offset="1" stop-color="#d9dee2"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d7ff"/><stop offset=".18" stop-color="#b75ce7"/><stop offset=".43" stop-color="#fff"/><stop offset=".62" stop-color="#5a0b87"/><stop offset=".84" stop-color="#a944dc"/><stop offset="1" stop-color="#2a003e"/></linearGradient>
  <radialGradient id="disc" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#160524"/><stop offset=".65" stop-color="#050209"/><stop offset="1" stop-color="#000"/></radialGradient>
  <linearGradient id="solidFade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000"/><stop offset=".35" stop-color="#000"/><stop offset=".58" stop-color="#888"/><stop offset=".72" stop-color="#fff"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <linearGradient id="wireFade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset=".38" stop-color="#fff"/><stop offset=".62" stop-color="#777"/><stop offset=".78" stop-color="#000"/><stop offset="1" stop-color="#000"/></linearGradient>
  <mask id="cogSolidMask" maskUnits="userSpaceOnUse"><rect x="120" y="150" width="580" height="560" fill="url(#solidFade)"/></mask>
  <mask id="cogWireMask" maskUnits="userSpaceOnUse"><rect x="70" y="120" width="620" height="620" fill="url(#wireFade)"/></mask>
  <mask id="vectisSolidMask" maskUnits="userSpaceOnUse"><rect x="650" y="150" width="1410" height="330" fill="url(#solidFade)"/></mask>
  <mask id="vectisWireMask" maskUnits="userSpaceOnUse"><rect x="650" y="150" width="1410" height="330" fill="url(#wireFade)"/></mask>
  <mask id="conceptsSolidMask" maskUnits="userSpaceOnUse"><rect x="665" y="420" width="1390" height="250" fill="url(#solidFade)"/></mask>
