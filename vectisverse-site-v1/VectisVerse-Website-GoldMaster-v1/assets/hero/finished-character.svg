             C556 182 561 227 548 268
             C536 305 505 334 458 343
             C412 334 381 306 369 269
             C356 228 365 184 399 161Z"
          fill="url(#skin)" stroke="#141219" stroke-width="8"/>
    <path d="M389 280 C407 319 432 337 458 343 C486 337 511 318 529 280"
          class="outline"/>
  </g>

