name: Verify Riptide HQ image binaries

on:
  pull_request:
    branches:
      - main
    paths:
      - 'vectisverse-site-v1/assets/riptide/hq/*.webp'
      - 'vectisverse-site-v1/riptide-hq-image-test.html'
      - '.github/workflows/verify-riptide-hq-native-images-pr.yml'

permissions:
  contents: read

jobs:
  verify-native-webp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify byte size, SHA-256 and WebP signature
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              Path('vectisverse-site-v1/assets/riptide/hq/riptide-hq-desktop.webp'): (910072, 'df93902a716a7f2ea7db0f723dc32471b7d7b0b0944e94ca4c1a85705bbbd2ce'),
              Path('vectisverse-site-v1/assets/riptide/hq/riptide-hq-mobile.webp'): (452928, '8d26b69f7527331a74e6f8447e82ea42de1c7a616736148a6d16c26a05bd3e5e'),
          }

          failed = False
          for path, (expected_bytes, expected_hash) in expected.items():
              if not path.exists():
                  print(f'FAIL {path}: file is missing')
                  failed = True
                  continue
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              signature_ok = data[:4] == b'RIFF' and data[8:12] == b'WEBP'
              size_ok = len(data) == expected_bytes
              hash_ok = digest == expected_hash
              print(f'{path}: bytes={len(data)}, sha256={digest}, signature={signature_ok}')
              if not (signature_ok and size_ok and hash_ok):
                  print(f'FAIL: expected bytes={expected_bytes}, sha256={expected_hash}')
                  failed = True
              else:
                  print('PASS')
          if failed:
              raise SystemExit('Riptide HQ native image verification failed.')
          print('All Riptide HQ native WebP files are exact matches for the approved originals.')
          PY
