<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="1200" viewBox="0 0 900 1200"
     role="img" aria-labelledby="title desc">
  <title id="title">Vectis Concepts finished character</title>
  <desc id="desc">Layered fully rendered futuristic hero character with armour, colour, energy accents, highlights and transparent background.</desc>

  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8c0b2"/>
      <stop offset="0.55" stop-color="#b59486"/>
      <stop offset="1" stop-color="#80685f"/>
    </linearGradient>

    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e2632"/>
      <stop offset="1" stop-color="#120f15"/>
    </linearGradient>

    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343846"/>
      <stop offset="0.5" stop-color="#202431"/>
      <stop offset="1" stop-color="#10141d"/>
    </linearGradient>

    <linearGradient id="armour" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0eef3"/>
      <stop offset="0.35" stop-color="#b9b8c4"/>
      <stop offset="0.7" stop-color="#6c6a77"/>
      <stop offset="1" stop-color="#34323c"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d06cff"/>
      <stop offset="0.5" stop-color="#943bcb"/>
      <stop offset="1" stop-color="#4e1b6c"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ff5ff"/>
      <stop offset="1" stop-color="#38abd6"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12"
                    flood-color="#15101a" flood-opacity="0.35"/>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .outline { fill:none; stroke:#141219; stroke-width:8; stroke-linejoin:round; stroke-linecap:round; }
      .detail { fill:none; stroke:#28242e; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
      .fine { fill:none; stroke:#5d5865; stroke-width:3.5; stroke-linejoin:round; stroke-linecap:round; }
      .highlight { fill:none; stroke:#f4f1f7; stroke-width:5; stroke-linecap:round; opacity:.75; }
    </style>
  </defs>

  <!-- 01_TRANSPARENT_BASE -->
  <g id="01_TRANSPARENT_BASE">
    <rect width="900" height="1200" fill="#fff" opacity="0"/>
  </g>

  <!-- 02_CAST_SHADOW -->
  <g id="02_CAST_SHADOW" opacity="0.26" filter="url(#shadow)">
    <ellipse cx="456" cy="1116" rx="200" ry="36" fill="#19131d"/>
    <path d="M385 338 C344 506 351 712 326 1045"
          fill="none" stroke="#19131d" stroke-width="38"/>
  </g>

