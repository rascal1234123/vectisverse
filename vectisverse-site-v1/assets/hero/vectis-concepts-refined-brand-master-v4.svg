    <polygon points="420.0,208.0 448.6,166.6 476.7,171.4 490.0,219.9 512.0,229.0 555.7,204.1 579.0,220.6 569.9,270.1 585.7,287.8 635.9,284.3 649.7,309.4 620.1,350.0 626.7,372.8 673.4,391.4 675.0,420.0 630.7,443.7 626.7,467.2 660.7,504.2 649.7,530.6 599.5,532.8 585.7,552.2 600.3,600.3 579.0,619.4 532.8,599.5 512.0,611.0 504.2,660.7 476.7,668.6 443.7,630.7 420.0,632.0 391.4,673.4 363.3,668.6 350.0,620.1 328.0,611.0 284.3,635.9 261.0,619.4 270.1,569.9 254.3,552.2 204.1,555.7 190.3,530.6 219.9,490.0 213.3,467.2 166.6,448.6 165.0,420.0 209.3,396.3 213.3,372.8 179.3,335.8 190.3,309.4 240.5,307.2 254.3,287.8 239.7,239.7 261.0,220.6 307.2,240.5 328.0,229.0 335.8,179.3 363.3,171.4 396.3,209.3" fill="url(#chromeMid)" stroke="#8d3fbd" stroke-width="6"/>
